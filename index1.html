<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <span style="position: absolute; top: 10px; left: 10px;">
    <label class="switch">
            <input id="themeToggle" type="checkbox">
            <span class="slider"></span>
        </label>  
<div class="DarkMode_Text">
            <h1 id="modeText">Light Mode</h1>
        </div>
    </span>
    
    <script src="taskify.js"></script>

  <span style="position: absolute; top: 10px; right: 30px;">
    <B>NIKKI MARIE F.PAMADA</B>
    <div class="section"><B>BSIT 2D</B></div>
  </span>
     
    <div class="TaskifyText">
        <h1>Taskify</h1>
        <p>A simple Task Manager.</p>

    </div>
    <label class="TypeBar">
        <input id="Bar" type="text" placeholder="Add a new task">
        <span class="addButton" id="button">+</span>
    </label>

<script src="taskify.js"></script>

 <div class="controls">
    <div class="buttons" style="text-align: center;">
        <button id="sortAZ">Sort A-Z</button>
        <button id="sortZA">Sort Z-A</button>
        <button id="Reset">Reset</button>
    </div>
</div>

<div class="container">
    <div class="stats">
      <span>Total Tasks: <strong id="total">0</strong></span>
      <span>Completed: <strong id="completed">0</strong></span>
      <span>Edited: <strong id="edited">0</strong></span>
      <span>Deleted: <strong id="deleted">0</strong></span>
    </div>
    <ul id="taskList" class="taskList"></ul>
</div>
  
</body>
</html>
